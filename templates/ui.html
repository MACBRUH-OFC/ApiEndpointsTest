<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Garena Engine | API Management Console</title>

<style>
:root {
    --bg-main: #09090b;
    --bg-card: #18181b;
    --border: #27272a;
    --border-hover: #3f3f46;
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --accent: #f59e0b;
    --accent-hover: #d97706;
    --accent-glow: rgba(245, 158, 11, 0.12);
    --success: #10b981;
    --error: #ef4444;
    --panel: #111114;
    --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    letter-spacing: -0.1px;
    padding-bottom: 80px;
}

/* Custom modern scrollbars */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: #2d2d34;
    border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
}

.wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px;
}

/* Premium Header styling */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    margin-bottom: 36px;
}

.brand-wrapper {
    display: flex;
    align-items: center;
    gap: 16px;
}

.brand-text {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.5px;
    color: #ffffff;
}

.brand-text span {
    color: var(--accent);
}

.live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
}

.pulsing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: smoothPulse 2s infinite alternate;
}

@keyframes smoothPulse {
    0% { transform: scale(0.95); opacity: 0.6; }
    100% { transform: scale(1.15); opacity: 1; }
}

/* Base Dashboard Card Structure */
.panel-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
}

.panel-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 1.2px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.clear-pills {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    transition: color 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
}

.clear-pills:hover {
    color: var(--error);
}

/* User Input Fields */
.input-group {
    position: relative;
    margin-bottom: 12px;
}

.search-field {
    width: 100%;
    height: 52px;
    background: #0d0d10;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #ffffff;
    padding: 0 160px 0 16px;
    font-size: 14px;
    font-family: var(--font-mono);
    outline: none;
    transition: all 0.2s ease;
}

.search-field:focus {
    border-color: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
}

.trigger-btn {
    position: absolute;
    right: 6px;
    top: 6px;
    height: 40px;
    padding: 0 20px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #000000;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease;
}

.trigger-btn:hover {
    background: var(--accent-hover);
}

.pills-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

.history-pill {
    padding: 6px 12px;
    background: #111114;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font-mono);
    transition: all 0.15s ease;
}

.history-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
}

/* Node Server Selectors */
.grid-servers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
}

.server-btn {
    height: 38px;
    background: #111114;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.server-btn:hover {
    border-color: var(--border-hover);
    color: #ffffff;
}

.server-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000000;
    box-shadow: 0 2px 10px var(--accent-glow);
}

/* Perspective view toggles */
.grid-perspectives {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.view-btn {
    height: 42px;
    background: #111114;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.view-btn:hover {
    border-color: var(--border-hover);
    color: #ffffff;
}

.view-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(245, 158, 11, 0.04);
}

/* Performance Metrics and KPIs */
.grid-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.metric-card {
    background: #111114;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
}

.metric-card::after {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 3px;
    height: 100%;
    background: var(--border);
}

.metric-card.active-state::after {
    background: var(--accent);
}

.metric-label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    margin-bottom: 6px;
}

.metric-value {
    font-size: 24px;
    font-weight: 700;
    font-family: var(--font-mono);
}

/* Output Toolbar Controller */
.toolbar-console {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
}

.search-console {
    flex: 1;
    display: flex;
    align-items: center;
    background: #0d0d10;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
    height: 40px;
    gap: 8px;
}

.search-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 13px;
    font-family: var(--font-mono);
}

.search-badge {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    white-space: nowrap;
    background: var(--bg-card);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
}

.nav-arrows {
    display: flex;
    gap: 4px;
}

.arrow-btn {
    width: 26px;
    height: 26px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.arrow-btn:hover:not(:disabled) {
    color: #fff;
    border-color: var(--border-hover);
}

.arrow-btn:disabled {
    opacity: 0.2;
    cursor: not-allowed;
}

.utility-actions {
    display: flex;
    gap: 8px;
}

.action-btn {
    height: 40px;
    padding: 0 16px;
    background: #111114;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s ease;
}

.action-btn:hover {
    border-color: var(--border-hover);
    color: #ffffff;
}

/* Monitor Window Layout */
.monitor-viewport {
    width: 100%;
    height: 520px;
    background: #040406;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: auto;
    color: #d1d5db;
    font-family: var(--font-mono);
    position: relative;
}

/* Category Sections */
.category-group {
    border-bottom: 1px solid var(--border);
}

.category-group:last-child {
    border-bottom: none;
}

.category-header {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent);
    letter-spacing: 1px;
    padding: 12px 18px;
    background: #0a0a0d;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.category-meta {
    display: flex;
    align-items: center;
    gap: 12px;
}

.copy-group-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    transition: color 0.15s ease;
}

.copy-group-btn:hover {
    color: var(--accent);
}

.count-badge {
    background: rgba(245, 158, 11, 0.08);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    color: var(--accent);
    border: 1px solid rgba(245, 158, 11, 0.15);
}

/* Item Rows */
.row-item {
    display: flex;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid #0d0d10;
    font-family: var(--font-mono);
    font-size: 13px;
    word-break: break-all;
    background: #040406;
}

.row-item:hover {
    background: #08080c;
}

.row-item:last-child {
    border-bottom: none;
}

.url-link {
    color: #60a5fa;
    text-decoration: none;
}

.url-link:hover {
    color: #93c5fd;
    text-decoration: underline;
}

.actions-cell {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 16px;
    flex-shrink: 0;
}

.icon-copy-action {
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.15s ease;
}

.icon-copy-action:hover {
    color: var(--accent);
}

/* Medias previews */
.preview-box {
    flex-shrink: 0;
    margin-right: 14px;
    width: 44px;
    height: 44px;
    background: #000000;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.thumb-preview {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: pointer;
    display: block;
}

.player-audio {
    height: 28px;
    width: 150px;
}

/* Decoded response Row styling */
.decoded-text-row {
    padding: 10px 18px;
    border-bottom: 1px solid #0d0d10;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-primary);
    word-break: break-all;
}

/* Scanning Simulator Styles */
.loading-viewport {
    padding: 60px 40px;
    text-align: center;
}

.viewport-log-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 20px;
}

.progress-track {
    width: 100%;
    max-width: 400px;
    height: 6px;
    background: #111114;
    border-radius: 10px;
    margin: 0 auto 30px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transition: width 0.1s linear;
}

.log-scroller-panel {
    text-align: left;
    margin: 0 auto;
    width: 100%;
    max-width: 500px;
    font-size: 11px;
    color: var(--text-muted);
    background: #000000;
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 6px;
    height: 130px;
    overflow: hidden;
}

.log-item-line {
    margin-bottom: 6px;
}

/* Highlight matching classes */
mark.search-match {
    background-color: var(--accent);
    color: #000000;
    border-radius: 2px;
}

mark.search-match.match-active {
    background-color: #f97316;
    color: #ffffff;
}

/* Lightbox Modal */
.overlay-lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    backdrop-filter: blur(4px);
}

.lightbox-body {
    position: relative;
    max-width: 85%;
    max-height: 85%;
}

.lightbox-body img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
    border: 1px solid var(--border);
    border-radius: 8px;
}

.lightbox-close-btn {
    position: absolute;
    top: -40px;
    right: 0;
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 24px;
    cursor: pointer;
}

/* Notifications */
.toast-notice {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #ffffff;
    color: #000000;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.2s ease;
    z-index: 1000;
}

.toast-notice.show {
    opacity: 1;
    transform: translateY(0);
}

@media (max-width: 768px) {
    header { flex-direction: column; align-items: flex-start; gap: 16px; }
    .toolbar-console { flex-direction: column; align-items: stretch; gap: 10px; }
    .grid-servers { grid-template-columns: repeat(4, 1fr); }
    .grid-metrics { grid-template-columns: 1fr; gap: 10px; }
}
</style>
</head>
<body>

<div class="wrapper">

    <!-- Navbar Module -->
    <header>
        <div class="brand-wrapper">
            <span class="brand-text">Garena <span>Console</span></span>
            <div class="live-badge">
                <div class="pulsing-dot"></div>
                <span>NODE OPERATOR: READY</span>
            </div>
        </div>
    </header>

    <!-- Section 1: Query Router -->
    <div class="panel-card">
        <div class="panel-title">
            <span>Query Pipeline Routing</span>
            <button class="clear-pills" onclick="clearHistory()">Reset History</button>
        </div>
        <div class="input-group">
            <input type="text" id="apiName" class="search-field" placeholder="Enter Garena API target path (e.g. LoginGetDesc)...">
            <button class="trigger-btn" onclick="runAPI()">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path d="M10 9l5 3-5 3V9z"/></svg>
                Run Pipeline
            </button>
        </div>
        <div class="pills-container" id="historyContainer"></div>
    </div>

    <!-- Section 2: Regional Cluster grid -->
    <div class="panel-card">
        <div class="panel-title">Regional Server Clusters</div>
        <div class="grid-servers" id="serverSelectorGrid">
            <button class="server-btn active" onclick="setServer(this,'ind')">IND</button>
            <button class="server-btn" onclick="setServer(this,'br')">BR</button>
            <button class="server-btn" onclick="setServer(this,'na')">NA</button>
            <button class="server-btn" onclick="setServer(this,'sac')">SAC</button>
            <button class="server-btn" onclick="setServer(this,'mea')">MEA</button>
            <button class="server-btn" onclick="setServer(this,'vn')">VN</button>
            <button class="server-btn" onclick="setServer(this,'bd')">BD</button>
            <button class="server-btn" onclick="setServer(this,'pk')">PK</button>
            <button class="server-btn" onclick="setServer(this,'sg')">SG</button>
            <button class="server-btn" onclick="setServer(this,'id')">ID</button>
            <button class="server-btn" onclick="setServer(this,'cis')">CIS</button>
            <button class="server-btn" onclick="setServer(this,'th')">TH</button>
            <button class="server-btn" onclick="setServer(this,'tw')">TW</button>
            <button class="server-btn" onclick="setServer(this,'eu')">EU</button>
        </div>
    </div>

    <!-- Section 3: Data perspectives -->
    <div class="panel-card">
        <div class="panel-title">Perspective Viewports</div>
        <div class="grid-perspectives">
            <button class="view-btn active" id="btn-links" onclick="setViewMode('links')">Links Only</button>
            <button class="view-btn" id="btn-decoded" onclick="setViewMode('decoded')">Decoded strings</button>
            <button class="view-btn" id="btn-raw" onclick="setViewMode('raw')">Raw payload</button>
        </div>
    </div>

    <!-- Section 4: KPI Monitor Metrics -->
    <div class="panel-card">
        <div class="panel-title">Data Pipeline Metrics</div>
        <div class="grid-metrics">
            <div class="metric-card active-state">
                <div class="metric-label">Parsed Strings</div>
                <div class="metric-value" id="stringCount">0</div>
            </div>
            <div class="metric-card active-state">
                <div class="metric-label">Asset URLs</div>
                <div class="metric-value" id="linkCount">0</div>
            </div>
            <div class="metric-card active-state">
                <div class="metric-label">Connection Status</div>
                <div class="metric-value" id="statusText" style="color: var(--text-muted);">IDLE</div>
            </div>
        </div>
    </div>

    <!-- Section 5: Control monitors terminal -->
    <div class="panel-card">
        <div class="panel-title">Output System Viewport</div>
        <div class="toolbar-console">
            <div class="search-console">
                <input type="text" class="search-input" id="searchBox" placeholder="Filter strings..." oninput="performSearch()">
                <span class="search-badge" id="searchCount">0/0</span>
                <div class="nav-arrows">
                    <button class="arrow-btn" id="prevSearchBtn" onclick="navigateSearch(-1)" disabled>▲</button>
                    <button class="arrow-btn" id="nextSearchBtn" onclick="navigateSearch(1)" disabled>▼</button>
                </div>
            </div>
            <div class="utility-actions">
                <button class="action-btn" onclick="copyOutput()">Copy</button>
                <button class="action-btn" onclick="downloadOutput()">Download</button>
                <button class="action-btn" onclick="clearOutput()">Flush</button>
            </div>
        </div>
        <div class="monitor-viewport" id="output">SYSTEM LOG: DEVICE STATUS STANDBY</div>
    </div>
</div>

<!-- Preview overlay -->
<div id="imageLightbox" class="overlay-lightbox" onclick="closeLightbox()">
    <div class="lightbox-body" onclick="event.stopPropagation()">
        <img id="lightboxImage" src="" alt="Preview viewport">
        <button class="lightbox-close-btn" onclick="closeLightbox()">✕</button>
    </div>
</div>

<div class="toast-notice" id="toastNotifier">Success: Copied to clipboard</div>

<script>
let selectedServer = "ind";
let viewMode = "links";
let lastOutputText = "";
let currentLinksArray = [];
let apiCachedData = null;

let searchMatches = [];
let currentMatchIndex = -1;

let queryHistory = JSON.parse(localStorage.getItem("ff_query_history") || "[]");

const BASE_LINK = "https://dl.dir.freefiremobile.com/common/";

const VALID_EXTENSIONS = [
    "png", "jpg", "jpeg", "webp", "gif",
    "bmp", "ktx", "html", "json",
    "mp4", "mp3", "wav", "ogg", "webm"
];

document.addEventListener("DOMContentLoaded", () => {
    updateHistoryUI();
});

function setServer(btn, server) {
    selectedServer = server;
    document.querySelectorAll(".server-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

function setViewMode(mode) {
    viewMode = mode;
    document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(`btn-${mode}`).classList.add("active");
    if (apiCachedData) {
        renderOutput(apiCachedData);
    }
}

function updateHistoryUI() {
    const container = document.getElementById("historyContainer");
    if (queryHistory.length === 0) {
        container.innerHTML = `<span style="color: var(--text-muted); font-style: italic; font-size:12px;">No scan history stored.</span>`;
        return;
    }
    container.innerHTML = `<span style="color: var(--text-muted); font-size:11px; font-weight:700; margin-right:4px; text-transform:uppercase;">Recent Scans:</span>`;
    queryHistory.forEach(endpoint => {
        const pill = document.createElement("button");
        pill.className = "history-pill";
        pill.innerText = endpoint;
        pill.onclick = () => {
            document.getElementById("apiName").value = endpoint;
            runAPI();
        };
        container.appendChild(pill);
    });
}

function saveToHistory(endpoint) {
    if (!endpoint) return;
    queryHistory = queryHistory.filter(e => e !== endpoint);
    queryHistory.unshift(endpoint);
    if (queryHistory.length > 8) queryHistory.pop();
    localStorage.setItem("ff_query_history", JSON.stringify(queryHistory));
    updateHistoryUI();
}

function clearHistory() {
    queryHistory = [];
    localStorage.removeItem("ff_query_history");
    updateHistoryUI();
    displayToast("History cleared");
}

function updateStatusUI(status, hexColor) {
    const el = document.getElementById("statusText");
    el.innerText = status;
    el.style.color = hexColor || "var(--text-primary)";
}

function displayToast(msg) {
    const toast = document.getElementById("toastNotifier");
    toast.innerText = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
}

function processHtmlUrl(val, isExplicitUrl = false) {
    val = val.trim();
    if (!val) return null;

    val = val.replace(/\.ff_extend/gi, '.jpg');
    val = val.replace(/\.ktx(p)?/gi, '.jpg');

    let val_lower = val.toLowerCase();

    if (val_lower.startsWith("http://") || val_lower.startsWith("https://")) {
        return { text: val, link: val };
    }

    const hasValidExtension = VALID_EXTENSIONS.some(ext => val_lower.endsWith('.' + ext)) || val_lower.endsWith('.ff_extend') || val_lower.endsWith('.ktxp');
    const hasSlashingPattern = val.includes("/") && (val.split("/").length > 1);

    if (isExplicitUrl || hasValidExtension || hasSlashingPattern) {
        const cleanVal = val.replace(/^\/+/, '');
        const cleanValLower = cleanVal.toLowerCase();

        let linkUrl = "";
        if (cleanValLower.startsWith("common/")) {
            linkUrl = "https://dl.dir.freefiremobile.com/" + cleanVal;
        } else {
            linkUrl = BASE_LINK + cleanVal;
        }
        return { text: val, link: linkUrl };
    }

    const social_domains = ["instagram.com", "discord.gg", "youtube.com", "youtu.be", "facebook.com", "twitter.com", "x.com", "whatsapp.com", "linktr.ee"];
    if (social_domains.some(domain => val_lower.includes(domain))) {
        let linkUrl = val;
        if (!val_lower.startsWith("http://") && !val_lower.startsWith("https://")) {
            linkUrl = "https://" + val;
        }
        return { text: val, link: linkUrl };
    }

    return null;
}

function getCategory(url) {
    const lower = url.toLowerCase();
    if (/\.(png|jpg|jpeg|webp|gif|bmp)/i.test(lower)) return "images";
    if (/\.(mp4|webm)/i.test(lower)) return "videos";
    if (/\.(mp3|wav|ogg)/i.test(lower)) return "audio";
    return "other";
}

function getDisplayPath(fullLink) {
    const basePrefix = "https://dl.dir.freefiremobile.com/common/";
    if (fullLink.startsWith(basePrefix)) {
        return fullLink.substring(basePrefix.length);
    }
    return fullLink;
}

async function runAPI() {
    const apiName = document.getElementById("apiName").value.trim();
    if (!apiName) {
        alert("Enter a target endpoint path string.");
        return;
    }

    updateStatusUI("SCANNING", "var(--accent)");
    resetSearchState();

    const output = document.getElementById("output");
    output.innerHTML = `
    <div class="loading-viewport">
        <div class="viewport-log-text" id="scannerStatus">Connecting Server: 0%</div>
        <div class="progress-track">
            <div class="progress-fill" id="scannerProgress"></div>
        </div>
        <div class="log-scroller-panel" id="scannerLogs">
            <div class="log-item-line">> Pre-loaded cached game dynamic settings...</div>
        </div>
    </div>`;

    const logs = [
        "Resolving secure regional client routing target...",
        "Querying dynamic client encryption handshake variables...",
        "Validating cached server security token metrics...",
        "Sending encrypted decompressed server packet buffers...",
        "Scanning decompressed response output strings..."
    ];

    let progress = 0;
    let logIndex = 0;
    const interval = setInterval(() => {
        if (progress < 92) {
            progress += Math.floor(Math.random() * 12) + 6;
            if (progress > 92) progress = 92;
            
            const fill = document.getElementById("scannerProgress");
            const txt = document.getElementById("scannerStatus");
            const logBox = document.getElementById("scannerLogs");
            
            if (fill) fill.style.width = `${progress}%`;
            if (txt) txt.innerText = `Connecting Server: ${progress}%`;
            
            if (logBox && logIndex < logs.length && progress > (logIndex * 15)) {
                const line = document.createElement("div");
                line.className = "log-item-line";
                line.innerText = `> ${logs[logIndex]}`;
                logBox.appendChild(line);
                logBox.scrollTop = logBox.scrollHeight;
                logIndex++;
            }
        }
    }, 120);

    try {
        let endpoint = `/run_script?server=${selectedServer}&name=${encodeURIComponent(apiName)}`;
        const res = await fetch(endpoint);
        const data = await res.json();

        clearInterval(interval);
        
        const finalFill = document.getElementById("scannerProgress");
        const finalTxt = document.getElementById("scannerStatus");
        if (finalFill) finalFill.style.width = `100%`;
        if (finalTxt) finalTxt.innerText = `Processing Server Handshake: 100%`;

        setTimeout(() => {
            try {
                if (data.error) {
                    updateStatusUI("FAULT", "var(--error)");
                    output.innerHTML = `<div style="color:var(--error); font-family:var(--font-mono); padding: 18px;">Execution Error: ${data.error}</div>`;
                    return;
                }

                document.getElementById("stringCount").innerText = data.count || 0;
                document.getElementById("linkCount").innerText = data.raw_count || 0;
                updateStatusUI("ACTIVE", "var(--success)");

                currentLinksArray = data.urls || [];
                apiCachedData = data; 
                
                saveToHistory(apiName);
                renderOutput(data);
            } catch (innerErr) {
                updateStatusUI("FAULT", "var(--error)");
                output.innerHTML = `<div style="color:var(--error); font-family:var(--font-mono); padding: 18px;">Display Render Error: ${innerErr.message}</div>`;
            }
        }, 200);

    } catch (err) {
        clearInterval(interval);
        updateStatusUI("FAULT", "var(--error)");
        output.innerHTML = `<div style="color:var(--error); font-family:var(--font-mono); padding: 18px;">System dropped server packet handshake connection.</div>`;
    }
}

function copyCategoryUrls(category) {
    const urls = [];
    const allCandidates = [];
    if (apiCachedData.urls) apiCachedData.urls.forEach(u => allCandidates.push({val: u, explicit: true}));
    if (apiCachedData.strings) apiCachedData.strings.forEach(s => allCandidates.push({val: s, explicit: false}));

    allCandidates.forEach(cand => {
        const parsed = processHtmlUrl(cand.val, cand.explicit);
        if (parsed && getCategory(parsed.link) === category) {
            urls.push(parsed.link);
        }
    });

    if (urls.length === 0) return;
    
    const uniqueUrls = [...new Set(urls)];
    navigator.clipboard.writeText(uniqueUrls.join("\n"));
    displayToast(`Copied ${uniqueUrls.length} links to clipboard`);
}

    const lightbox = document.getElementById("imageLightbox");
    const img = document.getElementById("lightboxImage");
    img.src = src;
    lightbox.style.display = "flex";
}

function closeLightbox() {
    document.getElementById("imageLightbox").style.display = "none";
}

function renderOutput(data) {
    const output = document.getElementById("output");
    output.innerHTML = ""; 

    if (viewMode === "links") {
        let processedTuples = [];
        const allCandidates = [];
        if (data.urls) data.urls.forEach(u => allCandidates.push({val: u, explicit: true}));
        if (data.strings) data.strings.forEach(s => allCandidates.push({val: s, explicit: false}));
        
        allCandidates.forEach(cand => {
            const parsed = processHtmlUrl(cand.val, cand.explicit);
            if (parsed) {
                processedTuples.push(parsed);
            }
        });

        const seen = new Set();
        processedTuples = processedTuples.filter(item => {
            const duplicate = seen.has(item.link);
            seen.add(item.link);
            return !duplicate;
        });

        processedTuples.sort((a, b) => a.text.localeCompare(b.text));
        currentLinksArray = processedTuples.map(item => item.link);

        if (processedTuples.length === 0) {
            output.innerHTML = `<div style="color:var(--text-muted); font-style:italic; padding: 24px;">No URLs extracted from decrypted payloads.</div>`;
            lastOutputText = "";
        } else {
            const grouped = { images: [], videos: [], audio: [], other: [] };
            processedTuples.forEach(item => {
                grouped[getCategory(item.link)].push(item);
            });

            let finalHtml = "";

            if (grouped.images.length > 0) {
                let sectionHtml = `<div class="category-group" id="block-images">
                    <div class="category-header">
                        <span>Images / Textures</span>
                        <div class="category-meta">
                            <button class="copy-group-btn" onclick="copyCategoryUrls('images')">Copy Category</button>
                            <span class="count-badge" id="badge-images">${grouped.images.length}</span>
                        </div>
                    </div>`;
                grouped.images.forEach(item => {
                    const cleanDisplayPath = getDisplayPath(item.link);
                    sectionHtml += `
                    <div class="row-item" data-url="${cleanDisplayPath}">
                        <div class="preview-box">
                            <img src="${item.link}" class="thumb-preview" loading="lazy" onclick="openLightbox('${item.link}')" onerror="this.src='https://dl.dir.freefiremobile.com/common/web_event/official2/dist/client/img/full_logo.969f536.png'">
                        </div>
                        <a href="${item.link}" target="_blank" class="url-link" onclick="event.stopPropagation();">${cleanDisplayPath}</a>
                        <div class="actions-cell" onclick="event.stopPropagation();">
                            <svg class="icon-copy-action" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" onclick="copyIndividualText('${item.link}')"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </div>
                    </div>`;
                });
                sectionHtml += `</div>`;
                finalHtml += sectionHtml;
            }

            if (grouped.videos.length > 0) {
                let sectionHtml = `<div class="category-group" id="block-videos">
                    <div class="category-header">
                        <span>Videos / Animations</span>
                        <div class="category-meta">
                            <button class="copy-group-btn" onclick="copyCategoryUrls('videos')">Copy Category</button>
                            <span class="count-badge" id="badge-videos">${grouped.videos.length}</span>
                        </div>
                    </div>`;
                grouped.videos.forEach(item => {
                    const cleanDisplayPath = getDisplayPath(item.link);
                    sectionHtml += `
                    <div class="row-item" data-url="${cleanDisplayPath}">
                        <div class="preview-box">
                            <video src="${item.link}" class="thumb-preview" preload="metadata" muted loop onmouseover="this.play()" onmouseout="this.pause(); this.currentTime=0;"></video>
                        </div>
                        <a href="${item.link}" target="_blank" class="url-link" onclick="event.stopPropagation();">${cleanDisplayPath}</a>
                        <div class="actions-cell" onclick="event.stopPropagation();">
                            <svg class="icon-copy-action" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" onclick="copyIndividualText('${item.link}')"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </div>
                    </div>`;
                });
                sectionHtml += `</div>`;
                finalHtml += sectionHtml;
            }

            if (grouped.audio.length > 0) {
                let sectionHtml = `<div class="category-group" id="block-audio">
                    <div class="category-header">
                        <span>Audio Soundtracks</span>
                        <div class="category-meta">
                            <button class="copy-group-btn" onclick="copyCategoryUrls('audio')">Copy Category</button>
                            <span class="count-badge" id="badge-audio">${grouped.audio.length}</span>
                        </div>
                    </div>`;
                grouped.audio.forEach(item => {
                    const cleanDisplayPath = getDisplayPath(item.link);
                    sectionHtml += `
                    <div class="row-item" data-url="${cleanDisplayPath}">
                        <div class="preview-box">
                            <audio src="${item.link}" controls class="player-audio" onclick="event.stopPropagation();"></audio>
                        </div>
                        <a href="${item.link}" target="_blank" class="url-link" onclick="event.stopPropagation();">${cleanDisplayPath}</a>
                        <div class="actions-cell" onclick="event.stopPropagation();">
                            <svg class="icon-copy-action" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" onclick="copyIndividualText('${item.link}')"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </div>
                    </div>`;
                });
                sectionHtml += `</div>`;
                finalHtml += sectionHtml;
            }

            if (grouped.other.length > 0) {
                let sectionHtml = `<div class="category-group" id="block-other">
                    <div class="category-header">
                        <span>Config Paths & Values</span>
                        <div class="category-meta">
                            <button class="copy-group-btn" onclick="copyCategoryUrls('other')">Copy Category</button>
                            <span class="count-badge" id="badge-other">${grouped.other.length}</span>
                        </div>
                    </div>`;
                grouped.other.forEach(item => {
                    const cleanDisplayPath = getDisplayPath(item.link);
                    sectionHtml += `
                    <div class="row-item" data-url="${cleanDisplayPath}">
                        <a href="${item.link.startsWith('http') ? item.link : '#'}" target="_blank" class="url-link" onclick="event.stopPropagation();">${cleanDisplayPath}</a>
                        <div class="actions-cell" onclick="event.stopPropagation();">
                            <svg class="icon-copy-action" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" onclick="copyIndividualText('${item.link}')"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </div>
                    </div>`;
                });
                sectionHtml += `</div>`;
                finalHtml += sectionHtml;
            }

            output.innerHTML = finalHtml;
            lastOutputText = processedTuples.map(item => item.link).join("\n");
        }
    } 
    else if (viewMode === "decoded") {
        const strings = data.strings || [];
        if (strings.length === 0) {
            output.innerHTML = `<div style="color:var(--text-muted); font-style:italic; padding: 24px;">No string structures decoded.</div>`;
            lastOutputText = "";
        } else {
            let html = "";
            strings.forEach(str => {
                let cleanStr = str.replace(/\.ff_extend/gi, '.jpg');
                cleanStr = cleanStr.replace(/\.ktx(p)?/gi, '.jpg');

                html += `
                <div class="decoded-text-row" data-text="${cleanStr}">
                    <span class="decoded-item-content">${cleanStr}</span>
                </div>`;
            });
            output.innerHTML = html;
            lastOutputText = strings.map(str => str.replace(/\.ff_extend/gi, '.jpg').replace(/\.ktx(p)?/gi, '.jpg')).join("\n");
        }
    } 
    else if (viewMode === "raw") {
        lastOutputText = data.raw_response || "";
        output.textContent = lastOutputText;
    }
    
    performSearch();
}

function copyOutput() {
    if (!lastOutputText) return;
    navigator.clipboard.writeText(lastOutputText);
    displayToast("Console logs copied to clipboard");
}

function clearOutput() {
    document.getElementById("output").innerHTML = "SYSTEM LOG: LOG VIEWPORT FLUSHED";
    document.getElementById("stringCount").innerText = "0";
    document.getElementById("linkCount").innerText = "0";
    document.getElementById("apiName").value = "";
    document.getElementById("searchBox").value = "";
    updateStatusUI("IDLE", "var(--text-muted)");
    lastOutputText = "";
    apiCachedData = null;
    currentLinksArray = [];
    resetSearchState();
    displayToast("Console flushed");
}

function downloadOutput() {
    if (!lastOutputText) return;
    const blob = new Blob([lastOutputText], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ff_console_${selectedServer}_logs.log`;
    a.click();
}

function performSearch() {
    const query = document.getElementById("searchBox").value.trim().toLowerCase();
    const output = document.getElementById("output");
    
    if (viewMode === "links") {
        if (!apiCachedData) return;
        const groups = output.querySelectorAll(".category-group");
        let visibleCount = 0;
        
        groups.forEach(group => {
            const rows = group.querySelectorAll(".row-item");
            let groupVisibleCount = 0;
            
            rows.forEach(row => {
                const url = row.getAttribute("data-url") || "";
                const linkElement = row.querySelector(".url-link");
                
                if (linkElement) {
                    if (!query) {
                        row.style.display = "flex";
                        linkElement.innerHTML = url;
                        groupVisibleCount++;
                    } else if (url.toLowerCase().includes(query)) {
                        row.style.display = "flex";
                        groupVisibleCount++;
                        const regex = new RegExp(`(${escapePattern(query)})`, "gi");
                        linkElement.innerHTML = url.replace(regex, `<mark class="search-match">$1</mark>`);
                    } else {
                        row.style.display = "none";
                    }
                } else {
                    const rowText = row.textContent || "";
                    if (!query || rowText.toLowerCase().includes(query)) {
                        row.style.display = "flex";
                        groupVisibleCount++;
                    } else {
                        row.style.display = "none";
                    }
                }
            });
            
            if (groupVisibleCount > 0) {
                group.style.display = "block";
                const badge = group.querySelector(".count-badge");
                if (badge) badge.innerText = groupVisibleCount;
                visibleCount += groupVisibleCount;
            } else {
                group.style.display = "none";
            }
        });
        
        searchMatches = Array.from(output.querySelectorAll("mark.search-match"));
        updateSearchStats(visibleCount, query);
    } 
    else if (viewMode === "decoded") {
        if (!apiCachedData) return;
        const rows = output.querySelectorAll(".decoded-text-row");
        let visibleCount = 0;
        
        rows.forEach(row => {
            const text = row.getAttribute("data-text") || "";
            const textSpan = row.querySelector(".decoded-item-content");
            
            if (textSpan) {
                if (!query) {
                    row.style.display = "block";
                    textSpan.innerHTML = text;
                    visibleCount++;
                } else if (text.toLowerCase().includes(query)) {
                    row.style.display = "block";
                    visibleCount++;
                    const regex = new RegExp(`(${escapePattern(query)})`, "gi");
                    textSpan.innerHTML = text.replace(regex, `<mark class="search-match">$1</mark>`);
                } else {
                    row.style.display = "none";
                }
            } else {
                const rowText = row.textContent || "";
                if (!query || rowText.toLowerCase().includes(query)) {
                    row.style.display = "block";
                    visibleCount++;
                } else {
                    row.style.display = "none";
                }
            }
        });
        
        searchMatches = Array.from(output.querySelectorAll("mark.search-match"));
        updateSearchStats(visibleCount, query);
    } 
    else if (viewMode === "raw") {
        if (!query) {
            resetSearchState();
            output.textContent = lastOutputText;
            return;
        }

        output.textContent = lastOutputText;
        highlightNodes(output, query);
        searchMatches = Array.from(output.querySelectorAll("mark.search-match"));
        
        if (searchMatches.length > 0) {
            currentMatchIndex = 0;
            updateSearchStatsUI();
            applyFocusHighlight();
        } else {
            currentMatchIndex = -1;
            updateSearchStatsUI();
        }
    }
}

function updateSearchStats(visibleCount, query) {
    const total = viewMode === "links" ? (currentLinksArray.length) : (apiCachedData ? apiCachedData.strings.length : 0);
    if (!query) {
        document.getElementById("searchCount").innerText = `${total}/${total}`;
        resetSearchState();
    } else {
        const matchLen = searchMatches.length;
        document.getElementById("searchCount").innerText = `Filtered: ${visibleCount} | Matches: ${matchLen}`;
        const state = matchLen === 0;
        document.getElementById("prevSearchBtn").disabled = state;
        document.getElementById("nextSearchBtn").disabled = state;
        if (matchLen > 0) {
            currentMatchIndex = 0;
            applyFocusHighlight();
        } else {
            currentMatchIndex = -1;
        }
    }
}

function highlightNodes(root, token) {
    const regex = new RegExp(`(${escapePattern(token)})`, "gi");
    function parser(node) {
        if (node.nodeType === Node.TEXT_NODE) {
            if (node.textContent.match(regex)) {
                const wrapper = document.createElement("span");
                wrapper.innerHTML = node.textContent.replace(regex, `<mark class="search-match">$1</mark>`);
                node.parentNode.replaceChild(wrapper, node);
            }
        } else if (node.nodeType === Node.ELEMENT_NODE && node.nodeName !== 'MARK' && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
            for (let i = node.childNodes.length - 1; i >= 0; i--) {
                parser(node.childNodes[i]);
            }
        }
    }
    parser(root);
}

function escapePattern(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function updateSearchStatsUI() {
    const len = searchMatches.length;
    const cur = len > 0 ? currentMatchIndex + 1 : 0;
    document.getElementById("searchCount").innerText = `${cur}/${len}`;
    const state = len === 0;
    document.getElementById("prevSearchBtn").disabled = state;
    document.getElementById("nextSearchBtn").disabled = state;
}

function applyFocusHighlight() {
    searchMatches.forEach(el => el.classList.remove("match-active"));
    if (currentMatchIndex >= 0 && currentMatchIndex < searchMatches.length) {
        const target = searchMatches[currentMatchIndex];
        target.classList.add("match-active");
        target.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}

function navigateSearch(offset) {
    if (searchMatches.length === 0) return;
    currentMatchIndex += offset;
    if (currentMatchIndex >= searchMatches.length) currentMatchIndex = 0;
    if (currentMatchIndex < 0) currentMatchIndex = searchMatches.length - 1;
    updateSearchStatsUI();
    applyFocusHighlight();
}
